name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EDITORIAL_RELEASE_ENABLED: 'false'
  HERMES_RSS_NOTIFY_ENABLED: 'false'
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  validate:
    name: validate
    runs-on: ${{ github.repository == 'gcake119/gcake-dev' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","repo-gcake-dev"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare isolated validation tools
        run: bash scripts/ci/prepare-validation.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          dest: ${{ runner.temp }}/gcake-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome and Linux dependencies for distribution fixtures
        run: bash scripts/ci/prepare-validation.sh browser

      - name: Full tests including Hermes
        # The isolated update harness deliberately accepts only this namespace.
        # Creating it on the disposable Linux runner preserves that restriction.
        run: |
          bash scripts/ci/prepare-validation.sh fixtures
          pnpm test

      - name: Astro and TypeScript checks
        run: pnpm check

      - name: Public site and all workspace builds
        run: pnpm build:all

      - name: Local release simulation without provider writes
        run: pnpm release:dry-run

      - name: Rehearse disposable static deployment and notification deduplication
        run: pnpm editorial:rehearse
