name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, checks and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Full tests including Hermes
        run: pnpm test

      - name: Astro and TypeScript checks
        run: pnpm check

      - name: Public site and all workspace builds
        run: pnpm build:all

      - name: Local release simulation without provider writes
        run: pnpm release:dry-run
