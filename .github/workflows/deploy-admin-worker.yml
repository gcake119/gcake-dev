name: Deploy Admin Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, repo-gcake-dev]
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare isolated Mint tools
        run: bash scripts/ci/prepare-validation.sh prepare

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          dest: ${{ runner.temp }}/gcake-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and build affected workspaces
        run: |
          pnpm --filter @gcake/admin test
          pnpm --filter @gcake/admin-worker test
          pnpm build:admin
          pnpm build:worker

      - name: Apply production D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/admin-worker
          packageManager: pnpm
          command: d1 migrations apply CMS_DB --env production --remote

      - name: Deploy production Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/admin-worker
          packageManager: pnpm
          command: deploy --env production

      - name: Verify production health
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error "$DEPLOYMENT_URL/health" | grep '"service":"gcake-admin-worker"'
