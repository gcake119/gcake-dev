name: Deploy Admin Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-admin-worker.yml'
      - 'apps/admin/**'
      - 'apps/admin-worker/**'
      - 'packages/admin-contract/**'
      - 'packages/publishing-contract/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and build affected workspaces
        run: |
          pnpm --filter @gcake/admin test
          pnpm --filter @gcake/admin-worker test
          pnpm build:admin
          pnpm build:worker

      - name: Apply production D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/admin-worker
          packageManager: pnpm
          command: d1 migrations apply CMS_DB --env production --remote

      - name: Deploy production Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/admin-worker
          packageManager: pnpm
          command: deploy --env production

      - name: Verify production health
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error "$DEPLOYMENT_URL/health" | grep '"service":"gcake-admin-worker"'
