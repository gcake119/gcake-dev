name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy main or perform approved read-only Secret acceptance
        type: choice
        default: deploy
        options: [deploy, secret-check]
      expected_sha:
        description: Exact reviewed feature SHA required for secret-check
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    if: inputs.mode != 'secret-check' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Checkout latest main for manual deployment
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate editorial series
        run: pnpm content:validate
      - name: Restore final snapshot or sync ongoing iThome series
        run: pnpm content:sync:ithome
      - name: Build
        run: pnpm build
        env:
          WEBSITE_ANALYTICS_ENABLED: 'true'
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: inputs.mode != 'secret-check' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Reject stale artifact after concurrent CMS edit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ needs.build.outputs.revision }}
          REPOSITORY: ${{ github.repository }}
        run: |
          current=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$SOURCE_REVISION"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  secret-check-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'secret-check' && github.ref == 'refs/heads/feat/editorial-release-queue'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require exact reviewed source and disabled production before Secret access
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          QUEUE_ENABLED: ${{ vars.EDITORIAL_RELEASE_ENABLED }}
          CMS_ENABLED: ${{ vars.RELEASE_AUTOMATION_ENABLED }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          test "${QUEUE_ENABLED:-false}" = false
          test "${CMS_ENABLED:-false}" = false

  secret-check:
    needs: secret-check-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'secret-check' && github.ref == 'refs/heads/feat/editorial-release-queue'
    environment: editorial-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require disabled production again before minting
        env:
          QUEUE_ENABLED: ${{ vars.EDITORIAL_RELEASE_ENABLED }}
          CMS_ENABLED: ${{ vars.RELEASE_AUTOMATION_ENABLED }}
        run: |
          test "${QUEUE_ENABLED:-false}" = false
          test "${CMS_ENABLED:-false}" = false
      - name: Create repository-scoped read-only acceptance token
        id: acceptance-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.EDITORIAL_APP_CLIENT_ID }}
          private-key: ${{ secrets.EDITORIAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
      - name: Verify expected installation and read-only repository scope
        env:
          GH_TOKEN: ${{ steps.acceptance-app.outputs.token }}
          APP_SLUG: ${{ steps.acceptance-app.outputs.app-slug }}
          INSTALLATION: ${{ steps.acceptance-app.outputs.installation-id }}
        run: |
          test "$APP_SLUG" = gcake-editorial-release
          test "$INSTALLATION" = 170331414
          gh api --hostname github.com /installation/repositories > "$RUNNER_TEMP/editorial-secret-scope.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          value=json.loads((Path(os.environ['RUNNER_TEMP'])/'editorial-secret-scope.json').read_text())
          repos=value.get('repositories',[])
          assert value.get('total_count') == 1 and len(repos) == 1, 'Unexpected repository scope'
          assert repos[0]['full_name'] == 'gcake119/gcake-dev', 'Wrong repository'
          # This endpoint does not promise user-style permission booleans.
          # Contents-read is constrained by the pinned token-creation action above.
          permissions=repos[0].get('permissions')
          if permissions is not None:
              assert isinstance(permissions, dict), 'Unexpected permission metadata type'
              assert not any(permissions.get(x) for x in ['push','admin','maintain']), 'Write metadata rejected'
              assert not any(v in ('write','admin') for v in permissions.values()), 'Write permission metadata rejected'
          PYTHON
          gh api --hostname github.com /repos/gcake119/gcake-dev/contents/package.json > "$RUNNER_TEMP/editorial-secret-content.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          value=json.loads((Path(os.environ['RUNNER_TEMP'])/'editorial-secret-content.json').read_text())
          assert value.get('type') == 'file' and value.get('path') == 'package.json', 'Content read not verified'
          print('Environment Secret accepted: expected App, one repository, contents-read constrained at token creation and content GET verified; no publication or deployment.')
          PYTHON
