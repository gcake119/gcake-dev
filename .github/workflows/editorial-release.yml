name: Editorial release queue
on:
  schedule:
    - cron: '0 23 * * 0,3'
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editorial-release-queue
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: editorial-release
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Request fenced release and public verification
        id: release
        env:
          RELEASE_WORKER_URL: ${{ vars.RELEASE_WORKER_URL }}
          RELEASE_AUTOMATION_SECRET: ${{ secrets.RELEASE_AUTOMATION_SECRET }}
        run: node --import tsx scripts/publishing/release-orchestrate.ts
  build:
    name: Build publication ${{ needs.release.outputs.release_sha }}
    needs: release
    if: needs.release.outputs.release_sha != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Restore pinned completed iThome snapshot
        run: pnpm content:restore:ithome
      - run: pnpm build
        env:
          WEBSITE_ANALYTICS_ENABLED: 'true'
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    name: Deploy publication ${{ needs.release.outputs.release_sha }}
    needs: [release, build]
    if: needs.release.outputs.release_sha != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject stale D1 publication artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ needs.release.outputs.release_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          current=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$SOURCE_REVISION"
      - name: Deploy committed publication
        id: deployment
        uses: actions/deploy-pages@v5
