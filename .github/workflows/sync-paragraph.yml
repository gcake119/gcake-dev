name: Prepare Paragraph sync (dry run only)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Published gcake-dev post slug
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --no-frozen-lockfile

      - name: Prepare publication payload
        run: pnpm paragraph:prepare "${{ inputs.slug }}"

      - name: Notice
        run: |
          echo "This workflow validates the shared portable publication and Paragraph dry-run plan only."
          echo "External writes, publication, Arweave verification, and newsletter delivery are disabled."
