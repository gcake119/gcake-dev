name: Validate editorial release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/editorial-release-queue]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EDITORIAL_RELEASE_ENABLED: 'false'
  HERMES_RSS_NOTIFY_ENABLED: 'false'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run all tests including editorial and Hermes
        run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - name: Rehearse disposable static deployment and notification deduplication
        run: pnpm editorial:rehearse
