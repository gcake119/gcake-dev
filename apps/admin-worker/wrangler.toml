name = "gcake-admin-worker"
main = "src/index.ts"
compatibility_date = "2026-09-28"

[vars]
PARAGRAPH_WRITE_ENABLED = "false"
SUBSTACK_WRITE_ENABLED = "false"

[env.development.vars]
PARAGRAPH_WRITE_ENABLED = "false"
SUBSTACK_WRITE_ENABLED = "false"

[[env.development.d1_databases]]
binding = "CMS_DB"
database_name = "gcake-cms-development"
database_id = "00000000-0000-0000-0000-000000000001"

[[env.development.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "gcake-media-development"

[env.preview.vars]
PARAGRAPH_WRITE_ENABLED = "false"
SUBSTACK_WRITE_ENABLED = "false"

[[env.preview.d1_databases]]
binding = "CMS_DB"
database_name = "gcake-cms-preview"
database_id = "00000000-0000-0000-0000-000000000002"

[[env.preview.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "gcake-media-preview"

# Production resources are intentionally not bound in Phase 0.
[env.production.vars]
PARAGRAPH_WRITE_ENABLED = "false"
SUBSTACK_WRITE_ENABLED = "false"
