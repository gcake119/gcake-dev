<!doctype html>
<html lang="zh-Hant" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文章結尾｜閱讀優先版面提案</title>
<style>
/* Public-site type mapping: root 17px/1.8; prose 1rem/1.9; article-end h2 1.18rem; pagination strong and actions 1rem; recommendation descriptions .82rem; footer .8rem. See docs/design-system.md, src/styles/global.css and Subscription.astro. */
:root{color-scheme:light;--paper:oklch(98% .007 250);--paper-deep:oklch(94% .023 250);--ink:oklch(25% .028 250);--ink-soft:oklch(43% .025 250);--muted:oklch(48% .025 250);--rule:oklch(82% .025 250);--rule-soft:oklch(90% .018 250);--accent:oklch(47% .11 250);--button-ink:oklch(98% .007 250);font:17px/1.8 system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
:root[data-theme=dark]{color-scheme:dark;--paper:oklch(22% .025 250);--paper-deep:oklch(28% .032 250);--ink:oklch(89% .014 250);--ink-soft:oklch(80% .02 250);--muted:oklch(72% .025 250);--rule:oklch(38% .023 250);--rule-soft:oklch(31% .025 250);--accent:oklch(75% .085 250);--button-ink:oklch(22% .025 250)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}button,select{font:inherit}button,a,summary,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:var(--accent);text-underline-offset:.25em}a:hover{text-decoration:underline}button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}svg{width:20px;height:20px;flex-shrink:0;vertical-align:middle}p,h1,h2,h3{margin:0}h1,h2,h3{line-height:1.45;letter-spacing:-.025em}button{border:0;background:none;color:var(--accent)}[hidden]{display:none!important}
.workbench{border-bottom:1px solid var(--rule);padding:24px 32px;background:var(--paper-deep)}.workbench-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;max-width:1280px;margin:auto}.workbench h1{font-size:1.25rem}.draft{font-size:.76rem;letter-spacing:.08em;color:var(--muted)}.workbench>p{max-width:1280px;margin:4px auto 0;font-size:.82rem;color:var(--ink-soft)}
.layout{max-width:1344px;margin:auto;display:grid;grid-template-columns:238px minmax(0,1fr);gap:48px;padding:32px}.controls{align-self:start;position:sticky;top:24px;font-size:.82rem}.controls h2{font-size:.8rem;color:var(--muted);margin-bottom:10px;font-weight:500}.scene-picker{display:grid;gap:8px;margin-bottom:26px}.scene-picker button{text-align:left;color:var(--ink-soft);border-left:2px solid transparent;padding:10px 12px;min-height:44px}.scene-picker button[aria-pressed=true]{color:var(--accent);border-color:var(--accent);background:var(--paper-deep);font-weight:650}.view-picker{display:flex;gap:8px;margin-bottom:12px}.view-picker button,.theme{min-height:44px;border:1px solid var(--rule);padding:5px 12px;border-radius:5px}.view-picker button[aria-pressed=true]{background:var(--accent);color:var(--button-ink);border-color:var(--accent)}.theme{display:flex;align-items:center;gap:8px;width:100%;justify-content:center}.rationale{margin-top:28px;border-top:1px solid var(--rule);padding-top:20px;color:var(--ink-soft)}.rationale p{margin-bottom:12px}.rationale strong{color:var(--ink);font-weight:600}.legend{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.73rem;margin-bottom:12px}.legend:before{content:"";width:16px;border-top:1px solid var(--rule)}
.stage{min-width:0}.paper{max-width:850px;margin:0 auto;background:var(--paper);transition:max-width .15s}.paper.phone{max-width:390px;border:1px solid var(--rule);border-radius:16px;overflow:hidden}.page{width:min(44rem,calc(100% - 48px));margin:auto;padding:8px 0 0}.phone .page{width:calc(100% - 40px);padding-top:24px}.context-label{font-size:.73rem;color:var(--muted);margin-bottom:10px}.article-context{font-size:1.1rem;margin-bottom:20px;font-weight:650;color:var(--ink-soft)}.tail{color:var(--ink-soft);font-size:1rem;line-height:1.9;padding-bottom:32px}.tail p+p{margin-top:16px}.end-marker{font-size:.73rem;color:var(--muted);margin-bottom:12px}.section{border-top:1px solid var(--rule);padding:26px 0 30px}.section h2{font-size:1.18rem;font-weight:700;margin-bottom:22px}.eyebrow{font-size:.82rem;color:var(--muted);margin-bottom:6px}.next{display:flex;gap:24px;align-items:center;text-decoration:none;min-height:44px;color:var(--ink)}.next h3{font-size:1rem;font-weight:700;line-height:1.8;letter-spacing:normal}.next svg{width:26px;height:26px;color:var(--accent)}.next:hover{color:var(--accent)}.next-copy{flex:1}.description{color:var(--ink-soft);font-size:.82rem;line-height:1.8;margin-top:10px}.series-links{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:16px}.series-links a{font-size:1rem;min-height:44px;display:inline-flex;align-items:center;gap:6px}.series-links .previous{max-width:65%}.series-links .overview{margin-left:auto;white-space:nowrap}.subheading{font-size:1rem;color:var(--muted);font-weight:650;margin:24px 0 0}.recommendations{padding:0;margin:0;list-style:none}.recommendations li{padding:18px 0;border-bottom:1px solid var(--rule-soft)}.recommendations li:last-child{border-bottom:0;padding-bottom:0}.recommendations a{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;color:var(--ink);text-decoration:none;font-size:1rem;font-weight:400;line-height:1.8}.recommendations a svg{color:var(--accent);width:18px}.recommendations a:hover{color:var(--accent)}.recommendations .description{font-size:.82rem;margin-top:4px;color:var(--muted)}.end-series{font-size:1rem;color:var(--ink-soft);margin:-10px 0 18px}.share-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--rule);padding:16px 0}.share-row p{font-size:.82rem;color:var(--muted)}.share-row button{display:inline-flex;align-items:center;min-height:44px;gap:8px;padding:0;font-size:1rem}.subscribe h2{margin-bottom:8px}.subscribe p{font-size:1rem;color:var(--ink-soft)}.subscription-links{display:flex;gap:24px;flex-wrap:wrap;margin-top:12px}.subscription-links a{display:inline-flex;min-height:44px;align-items:center;gap:8px;text-decoration:none;font-size:1rem}.references{border-top:1px solid var(--rule);padding:4px 0 24px}.references summary{min-height:44px;cursor:pointer;color:var(--muted);font-size:1rem;display:list-item;list-style-position:inside;padding:9px 0}.references h3{font-size:1.18rem;margin:12px 0 8px}.references ul{padding-left:20px;margin:0 0 14px;font-size:1rem;overflow-wrap:anywhere}.references li{margin:8px 0}.site-footer{border-top:1px solid var(--rule);padding:20px 0 24px;font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}.notice{font-size:.74rem;color:var(--muted);margin:24px 0 0;line-height:1.8}.status{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:calc(100% - 40px);padding:10px 18px;border:1px solid var(--rule);background:var(--paper-deep);border-radius:5px;font-size:.82rem;z-index:2}.phone .share-row{gap:4px}.phone .series-links{display:grid;gap:4px}.phone .series-links .previous{max-width:none}.phone .series-links .overview{margin-left:0}
@media(max-width:850px){.layout{grid-template-columns:1fr;gap:28px;padding:24px 20px}.controls{position:static}.scene-picker{display:flex;flex-wrap:wrap;margin-bottom:16px;gap:4px}.scene-picker button{border:1px solid var(--rule);border-radius:5px;font-size:.8rem}.scene-picker button[aria-pressed=true]{border-color:var(--accent)}.rationale{display:none}.control-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.view-picker{margin:0}.theme{width:auto}.workbench{padding:20px}.workbench-top{align-items:flex-start}.draft{font-size:.65rem}.page{width:100%}.paper.phone .page{width:calc(100% - 40px)}.legend{margin:0 0 12px}.series-links .previous{max-width:none}.share-row{gap:4px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header class="workbench"><div class="workbench-top"><h1>文章結尾・閱讀優先</h1><span class="draft">版面提案 01・字級對齊</span></div><p>先幫讀者找到下一篇，再安排分享與訂閱。以下可切換文章情境，查看同一套版面如何變化。</p></header>
<div class="layout"><aside class="controls" aria-label="提案檢視控制"><h2>文章情境</h2><div class="scene-picker"><button data-case="series" aria-pressed="true">系列文章</button><button data-case="last" aria-pressed="false">系列最後一篇</button><button data-case="standalone" aria-pressed="false">獨立文章</button></div><h2>檢視方式</h2><div class="control-row"><div class="view-picker"><button data-view="desktop" aria-pressed="true">桌面</button><button data-view="phone" aria-pressed="false">手機 390</button></div><button class="theme" id="theme" aria-label="切換至暗色主題">◐ <span>切換暗色</span></button></div><div class="rationale"><h2>這份提案的重點</h2><p><strong>01　先告訴讀者接著讀什麼</strong><br>系列下一篇用最大層級呈現；上一篇與系列總覽放在同一組。</p><p><strong>02　推薦只出現一次</strong><br>合併原本兩組推薦。系列有下一篇時，另列最多兩篇；其他情境最多三篇。</p><p><strong>03　次要操作往後放</strong><br>分享、訂閱不打斷閱讀導覽。參考與引用保持收合。</p><p class="notice">標題與摘要取自現有公開文章，正文尾段為版面示意文案。這是版面提案，連結與分享不對外操作；推薦的排序規則仍待確認。</p></div></aside>
<main class="stage"><div class="legend">下方為文章頁內容；上方與左側是提案控制列。</div><div class="paper" id="paper"><div class="page" id="article-ending" aria-live="polite"></div></div></main></div><div class="status" role="status" id="status" hidden></div>
<script>
const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>';
const share='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M5 13v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></svg>';
const mail='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v14H3Zm0 0 9 8 9-8"/></svg>';
const rss='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M5 3a16 16 0 0 1 16 16M5 9a10 10 0 0 1 10 10"/><circle cx="5" cy="19" r="1.5" fill="currentColor" stroke="none"/></svg>';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data,scene='series';
const toast=message=>{const s=document.getElementById('status');s.textContent=message;s.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>s.hidden=true,3500)};
function link(text,cls=''){return `<a href="#" class="${cls}" data-preview>${esc(text)}</a>`}
function render(){
 const c=data.cases.find(x=>x.key===scene),a=c.article;
 const next=c.next?`<div class="eyebrow">下一篇・${esc(a.seriesTitle)}</div><a class="next" href="#" data-preview><div class="next-copy"><h3>${esc(c.next.title)}</h3></div>${arrow}</a><p class="description">${esc(c.next.description)}</p>`:'';
 const nav=a.series?`<nav class="series-links" aria-label="本系列導覽">${c.previous?link('← 上一篇：'+c.previous.title,'previous'):''}${link('查看完整系列 →','overview')}</nav>`:'';
 const picks=c.picks.map(x=>`<li><a href="#" data-preview><span>${esc(x.title)}</span>${arrow}</a><p class="description">${esc(x.description)}</p></li>`).join('');
 const refs=c.references;
 let refBody='';
 for(const [key,label] of [['outgoing','本文提及的文章'],['incoming','引用本文的文章']]){if(refs[key]?.length){refBody+=`<h3>${label}</h3><ul>`+refs[key].map(id=>`<li>${link(data.articles[id]?.title||id)}</li>`).join('')+'</ul>'}}
 if(refs.external?.length)refBody+='<h3>外部參考</h3><ul>'+refs.external.map(x=>`<li>${link(x.title||x.href)}</li>`).join('')+'</ul>';
 const references=refBody?`<details class="references"><summary>參考與引用</summary>${refBody}</details>`:'';
 document.getElementById('article-ending').innerHTML=`<div class="context-label">正在預覽：${scene==='series'?'系列文章':scene==='last'?'系列最後一篇':'獨立文章'}</div><h2 class="article-context">${esc(a.title)}</h2><div class="tail"><p>${scene==='series'?'讀到這裡，我開始發現，開發不只是讓程式跑起來，也包含判斷自己還沒有告訴 AI 的事。':scene==='last'?'這三十天整理的，不只是使用 AI 寫程式的方法，也是我如何逐漸學會理解產品、工程與自己的判斷。':'讓工作流跟著實務持續迭代。當規格、設計、實作與驗證各自負責的事情清楚，接下來要做什麼，也更容易判斷。'}</p></div><section class="section reading" aria-labelledby="reading-title"><h2 id="reading-title">接著讀</h2>${scene==='last'?'<p class="end-series">這個系列已讀到最後一篇。也可以從這些文章，繼續往下探索。</p>':''}${next}${nav}${c.next&&picks?'<h3 class="subheading">也可以讀</h3>':''}${picks?`<ul class="recommendations">${picks}</ul>`:''}</section><div class="share-row"><p>這篇文章對你有幫助嗎？</p><button type="button" id="share-preview">${share}<span>分享這篇文章</span></button></div><section class="section subscribe" aria-labelledby="subscribe-title"><h2 id="subscribe-title">持續讀新的開發筆記</h2><p>透過電子報或 RSS，追蹤新的文章。</p><div class="subscription-links"><a href="#" data-preview>${mail}<span>電子報（Substack）</span>${arrow}</a><a href="#" data-preview>${rss}<span>RSS</span>${arrow}</a></div></section>${references}<footer class="site-footer"><span>雞蛋糕的開發筆記</span><span>既有全站頁尾</span></footer>`;
 document.getElementById('share-preview').addEventListener('click',()=>toast('這是版面提案，分享按鈕未連接系統選單。'));
 document.querySelectorAll('[data-preview]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();toast('這是版面提案，保留在目前畫面。')}));
 document.querySelectorAll('[data-case]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.case===scene)));
}
document.querySelectorAll('[data-case]').forEach(el=>el.addEventListener('click',()=>{scene=el.dataset.case;render()}));
document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>{document.getElementById('paper').classList.toggle('phone',el.dataset.view==='phone');document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===el)))}));
document.getElementById('theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('#theme span').textContent=dark?'切換明亮':'切換暗色';document.getElementById('theme').setAttribute('aria-label',dark?'切換至明亮主題':'切換至暗色主題')});
fetch('./data.json').then(r=>{if(!r.ok)throw new Error();return r.json()}).then(d=>{data=d;render()}).catch(()=>{document.getElementById('article-ending').textContent='無法載入提案內容，請重新整理。'});
</script></body></html>
